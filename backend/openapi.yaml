openapi: 3.1.0
info:
  title: AgentPay API
  version: 0.1.0
  summary: Wallet, escrow, marketplace, and agent permission API blueprint.
servers:
  - url: https://api.zebepay.com
    description: Production API
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/auth/signup:
    post:
      summary: Create a human-owned account
      tags: [Auth]
      responses:
        "201":
          description: Account created
  /api/v1/wallet:
    get:
      summary: Get wallet balances and ledger summary
      tags: [Wallet]
      responses:
        "200":
          description: Wallet returned
  /api/v1/deposits/binance-pay:
    post:
      summary: Create Binance Pay funding session
      tags: [Wallet]
      responses:
        "201":
          description: Funding session created
  /api/v1/webhooks/binance-pay:
    post:
      summary: Receive and verify Binance Pay webhook
      tags: [Webhooks]
      security: []
      responses:
        "202":
          description: Webhook accepted for reconciliation
  /api/v1/agents:
    get:
      summary: List user agents
      tags: [Agents]
      responses:
        "200":
          description: Agents returned
    post:
      summary: Register a new agent with spending rules
      tags: [Agents]
      responses:
        "201":
          description: Agent registered
  /api/v1/agents/{agentId}/pause:
    post:
      summary: Pause an agent immediately
      tags: [Agents]
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent paused
  /api/v1/listings:
    get:
      summary: Browse active marketplace listings
      tags: [Marketplace]
      responses:
        "200":
          description: Listings returned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Listing"
    post:
      summary: Merchant submits a listing reference for admin approval
      tags: [Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Listing submitted
  /api/v1/listings/{publicSlug}/schema:
    get:
      summary: Fetch machine-readable buyer-agent intake schema for a listing
      tags: [Marketplace]
      security: []
      parameters:
        - name: publicSlug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      responses:
        "200":
          description: Listing schema returned
          content:
            application/json:
              schema:
                type: object
                required: [listing_id, public_slug, schema_id, price, currency, requirements_schema]
                properties:
                  listing_id:
                    type: string
                  public_slug:
                    type: string
                  schema_id:
                    type: string
                  price:
                    $ref: "#/components/schemas/MoneyAmount"
                  currency:
                    type: string
                  requirements_schema:
                    type: object
                    additionalProperties: true
                  delivery_artifact:
                    type: object
                    additionalProperties: true
                  production_boundary:
                    type: string
        "404":
          description: Listing not found
  /api/v1/sandbox/client-environment:
    get:
      summary: Fetch sandbox wallet, flagship listing, schema route, and buyer-agent test flow
      tags: [Sandbox]
      security: []
      responses:
        "200":
          description: Sandbox client environment returned
          content:
            application/json:
              schema:
                type: object
                required: [mode, network, wallet, flagship_listing, buyer_agent_flow]
                properties:
                  mode:
                    type: string
                    enum: [sandbox]
                  network:
                    type: string
                    enum: [testnet]
                  wallet:
                    type: object
                    required: [asset, available_balance, escrow_locked, funding_action]
                    properties:
                      asset:
                        type: string
                        example: testUSDT
                      available_balance:
                        $ref: "#/components/schemas/MoneyAmount"
                      escrow_locked:
                        $ref: "#/components/schemas/MoneyAmount"
                      funding_action:
                        type: string
                      production_boundary:
                        type: string
                  flagship_listing:
                    type: object
                    required: [id, public_slug, title, price, currency, schema_url]
                    properties:
                      id:
                        type: string
                      public_slug:
                        type: string
                      title:
                        type: string
                      price:
                        $ref: "#/components/schemas/MoneyAmount"
                      currency:
                        type: string
                      schema_url:
                        type: string
                      delivery_artifact:
                        type: object
                        additionalProperties: true
                  buyer_agent_flow:
                    type: array
                    items:
                      type: string
                  escrow_trigger:
                    type: string
                  launch_gate:
                    type: string
  /api/v1/orders:
    post:
      summary: Create order and lock escrow after policy checks
      tags: [Escrow]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "402":
          description: Insufficient available wallet balance
        "409":
          description: Duplicate idempotency key
  /api/v1/orders/{orderId}/deliver:
    post:
      summary: Merchant submits delivery proof
      tags: [Escrow]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery proof submitted
  /api/v1/orders/{orderId}/release:
    post:
      summary: Release escrow after buyer or admin approval
      tags: [Escrow]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Escrow released
  /api/v1/admin/reviews:
    get:
      summary: List pending admin reviews
      tags: [Admin]
      responses:
        "200":
          description: Reviews returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentHmac:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    MoneyAmount:
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,18})?$"
      description: Decimal string stored in PostgreSQL as NUMERIC(36, 18). Never send as float.
      examples: ["48.000000000000000000"]
    Listing:
      type: object
      required: [id, mongo_listing_id, schema_id, title, category, price, currency, requirements_schema]
      properties:
        id:
          type: string
          format: uuid
        mongo_listing_id:
          type: string
        schema_id:
          type: string
          example: agentpay.listing.api-integration-review.v1
        title:
          type: string
        category:
          type: string
        price:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          example: USDT
        requirements_schema:
          type: object
          additionalProperties: true
    CreateListingRequest:
      type: object
      required: [mongo_listing_id, public_slug, schema_id, price, currency, requirements_schema]
      properties:
        mongo_listing_id:
          type: string
        public_slug:
          type: string
        schema_id:
          type: string
        price:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          example: USDT
        requirements_schema:
          type: object
          additionalProperties: true
    Order:
      type: object
      required: [id, listing_id, amount, currency, status]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          example: USDT
        status:
          type: string
          enum: [created, approved, escrow_locked, in_delivery, delivered, released, refunded, disputed, cancelled]
